<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地区对接人速查</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eef0f4;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#222;padding:28px 16px 60px;zoom:.9}
@supports not (zoom:1){.wrap{transform:scale(.9);transform-origin:top center}}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:26px;font-weight:800;color:#15181d}
.sub{color:#8a94a3;font-size:13px;margin-top:8px}
.usage{color:#e03e3e;font-weight:700;font-size:15px;margin:22px 0 14px}
.usage .chip{background:#fdecec;border-radius:4px;padding:2px 9px;margin-left:10px}
.searchwrap{position:relative}
.searchbox{background:#fff;border:2px solid #2f7bff;border-radius:12px;display:flex;align-items:center;padding:12px 16px;gap:10px}
.searchbox .ico{color:#9aa4b2;font-size:17px}
.searchbox input{border:none;outline:none;flex:1;font-size:17px;color:#333;background:transparent}
.searchbox input::placeholder{color:#a8b0bc}
.searchbox .clr{display:none;color:#9aa4b2;font-size:18px;cursor:pointer;border:none;background:none}
.searchbox .kbd{color:#c3cad5;font-size:12px;border:1px solid #e2e7ee;border-radius:5px;padding:1px 7px;flex:none}
.sugs{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #d8dee8;border-radius:10px;margin-top:6px;box-shadow:0 10px 28px rgba(20,30,60,.14);z-index:50;display:none;max-height:330px;overflow:auto}
.sug{padding:9px 14px;font-size:14px;cursor:pointer;display:flex;gap:10px;align-items:center}
.sug:hover,.sug.on{background:#f2f6ff}
.sug .tg{color:#9aa4b2;font-size:12px;flex:none;min-width:56px}
.sug .sub2{color:#9aa4b2;font-size:12px;margin-left:auto}
.hot{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:#8a94a3}
.hot .hk{background:#fff;border:1px solid #d8dee8;color:#2b6de8;border-radius:14px;padding:3px 12px;font-size:12.5px;cursor:pointer}
.hot .hk:hover{border-color:#2f7bff;background:#f2f6ff}
.hot .hk.recent{color:#7a8494;border-style:dashed}
.hk .hx{margin-left:7px;color:#b6bdcb;font-weight:800}
.hk .hx:hover{color:#e03e3e}
.sugtip{padding:7px 14px;font-size:12px;color:#9aa4b2;border-bottom:1px solid #eef1f6}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tab{background:#fff;border:1px solid #d8dee8;color:#444;border-radius:7px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.tab:hover{border-color:#2f7bff;color:#2f7bff}
.tab.on{background:#2b6de8;border-color:#2b6de8;color:#fff;font-weight:700}
.tab.reset{border-color:#e3b1b1;color:#c0392b}
.notes{background:#fff8e6;border:1px solid #e6b800;border-radius:10px;padding:14px 18px;margin-top:20px}
.notes .nt{font-weight:800;color:#8a6d00;font-size:15px;margin-bottom:10px}
.notes .ni{margin-top:6px;font-size:14px;color:#7a5c00;font-weight:700}
.notes .ni .tag{color:#b5563c;margin-right:10px}
.cap{color:#8a94a3;font-size:13px;margin:20px 0 10px;font-weight:700}
.tscroll{overflow:auto;background:#fff;border-radius:10px;max-height:560px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th{background:#f2f4f8;color:#333;font-size:13px;text-align:left;padding:11px 12px;position:sticky;top:0;z-index:2;white-space:nowrap;border-bottom:1px solid #dfe5ee}
td{padding:10px 12px;border-bottom:1px solid #e8ecf2;white-space:nowrap}
td.rg{font-weight:800;color:#222;background:#fafbfd}
td .none{color:#b0b8c4}
.w1{width:84px;min-width:84px;max-width:84px}
.w2{width:118px;min-width:118px;max-width:118px}
.nc{display:inline-block;background:#eef3ff;color:#2b6de8;border-radius:4px;font-size:10.5px;font-weight:700;padding:0 4px;margin-left:3px}
.clip{display:block;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip4{display:block;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp{cursor:pointer;border-radius:5px}
.cp:hover{background:#eaf1ff;outline:1px dashed #9db9f5}
.wa{width:180px;min-width:180px}
.wb{width:340px;min-width:340px}
.nrow td{background:#fdf6e3;color:#7a5c00;font-weight:700}
.rcard{background:#fff;border-radius:10px;padding:16px 20px;margin-top:16px}
.rcard .rh{font-size:17px;font-weight:800}
.chip2{background:#e8ecf2;color:#555;border-radius:6px;font-size:12px;padding:2px 8px;margin-left:8px;font-weight:400}
.rbox{background:#fdeee0;border-radius:8px;padding:12px 16px;margin-top:10px}
.rbox .rl{color:#b5563c;font-weight:700;font-size:13px}
.rbox .rn{font-size:20px;font-weight:800;margin-top:4px}
.rbox .rp{font-size:13px;color:#666;font-weight:400}
.copybtn{border:none;background:#2b6de8;color:#fff;border-radius:6px;padding:4px 14px;font-size:13px;cursor:pointer;margin-left:12px;vertical-align:middle}
.copybtn:hover{background:#1f5bd0}
th.sl0{left:0;z-index:4}
th.sl1{left:84px;z-index:4}
td.sl0{position:sticky;left:0;z-index:1;background:#fff}
td.sl1{position:sticky;left:84px;z-index:1;background:#fff}
td.rg.sl0{background:#fafbfd}
.slE{box-shadow:2px 0 0 #dfe5ee}
.pcard{background:#fff;border-radius:10px;padding:20px 24px;margin-top:20px}
.pcard .pn{font-size:19px;font-weight:800}
.pcard .row{display:flex;margin-top:12px;font-size:14px}
.pcard .row .lb{color:#8a94a3;width:90px;flex:none}
.pcard .row .vl{font-weight:800}
.foot{color:#9aa4b3;font-size:12px;margin-top:26px;line-height:1.9}
.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:#333;color:#fff;border-radius:8px;padding:10px 20px;font-size:14px;display:none;z-index:99;max-width:80vw}
</style>
</head>
<body>
<div class="wrap">
<h1>地区对接人速查</h1>
<div class="sub" id="sub"></div>
<div class="usage">使用【地区+角色】快速搜索，如：<span class="chip">广州设备</span><span class="chip">三河货损</span><span class="chip">上海 货损</span><span style="color:#8a94a3;font-weight:400;font-size:13px;margin-left:10px">输完按回车 ↵ 跳转到结果位置（输入过程页面不会动）</span></div>
<div class="searchwrap">
<div class="searchbox"><span class="ico">🔍</span><input id="q" placeholder="输入 地区+角色 / 片区 / 姓名，如：广州设备"><span class="kbd">/ 聚焦 · ↵ 跳转结果 · Esc 清空</span><button class="clr" id="clr">⊗</button></div>
<div class="sugs" id="sugs"></div>
</div>
<div class="hot" id="hotRow"></div>
<div class="tabs" id="regionTabs"></div>
<div class="tabs" id="roleTabs"></div>
<div class="notes" id="notes" style="display:none"></div>
<div class="pcard" id="pcard" style="display:none"></div>
<div class="cap" id="cap"></div>
<div class="tscroll" id="tscroll"><table id="tbl"></table></div>
<div class="foot">数据来源：企微智能表格 [地区对接人名单]（静态快照，同步时间见顶部）· 名单更新后由维护者在 Kimi 说「更新对接人」重新生成并发布<br>[找责任督导] / [责任督导] / [督导] 表示该片区未指定专人 · 单击任意人名/账号即可复制，粘贴到企微搜索找人</div>
</div>
<div class="toast" id="toast"></div>
<script>
let DATA = null;
async function boot(){
  const base = await (await fetch('data.json',{cache:'no-store'})).json();
  const chunks = await Promise.all(Array.from({length: base.meta.n_chunks}, (_,i)=>fetch('rows-'+(i+1)+'.json',{cache:'no-store'}).then(r=>r.json())));
  DATA = base;
  DATA.rows = chunks.flatMap(c=>c.rows);
  init();
}
let curRegion = null, curRole = null, curAreaFilter = null, curPerson = null, curResult = null;
const $ = id => document.getElementById(id);
const HOT = ['货损','客诉','物流','设备','合同','效期','调价','撤架'];
let RECENT = [];
try{RECENT = JSON.parse(localStorage.getItem('djr_recent')||'[]');}catch(e){RECENT=[];}
function saveRecent(q){
  if(!q||q.length<2)return;
  RECENT = [q].concat(RECENT.filter(x=>x!==q)).slice(0,5);
  try{localStorage.setItem('djr_recent',JSON.stringify(RECENT));}catch(e){}
  renderHot();
}
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3500);}
function copyText(t){
  t=(t||'').trim();if(!t)return;
  const disp=t.replace(/\n/g,'、');
  const done=()=>toast('已复制：'+disp+'，粘贴到企微搜索即可找人');
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast('复制失败，请手动选择');}document.body.removeChild(ta);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(fallback);}else fallback();
}
function cleanName(v){return v? v.replace(/（.*?）$/,'').trim():v;}
function fmtArea(a){return esc(a).replace(/（新城）$/,'<span class="nc">新城</span>');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtCell(v){return v?esc(v).replace(/\n+/g,'、'):'';}
function tit(v){return v?esc(v).replace(/"/g,'&quot;'):'';}
function clip(v,cls){cls=cls||'clip';return v?'<div class="'+cls+' cp" data-v="'+tit(v)+'" title="'+tit(v)+'（单击复制）">'+fmtCell(v)+'</div>':'<div class="'+cls+'"><span class="none">—</span></div>';}
const NARROW={'合同接口人':1,'结算接口人':1,'费用修改':1};
const SPEC={'AI群内管家账号':['AI管家','AI群内'],'管家账号（非AI群）':['管家账号','非AI管家']};
function accountLines(v){return v? v.split(/\n+/).map(s=>s.trim()).filter(Boolean):[];}
let PINDEX={};
function addP(n,ro,r){if(!n)return;const e=PINDEX[n]||(PINDEX[n]={roles:[],areas:[]});if(!e.roles.includes(ro))e.roles.push(ro);const a=r.area+'('+r.region+')';if(!e.areas.includes(a))e.areas.push(a);}
function buildIndex(){PINDEX={};DATA.rows.forEach(r=>{DATA.roles.forEach(ro=>{const v=r.roles[ro];if(!v)return;addP(cleanName(v),ro,r);accountLines(v).forEach(l=>addP(l,ro,r));});});}
function init(){
  $('sub').textContent = DATA.meta.n_regions+' 大区 '+DATA.meta.n_areas+' 片区 · '+DATA.meta.n_roles+' 类接口人 · 数据 '+DATA.meta.synced_at+' 同步';
  buildIndex();
  renderRegionTabs(); renderRoleTabs(); renderNotes(); renderHot(); render();
  $('q').addEventListener('input', onSearch);
  $('q').addEventListener('keydown', onKey);
  $('clr').addEventListener('click', ()=>{$('q').value='';onSearch();$('q').focus();});
  $('tbl').addEventListener('click', e=>{
    const c=e.target.closest('.cp');
    if(c){const v=c.dataset.v;copyText(v.indexOf('\n')>=0?v:cleanName(v));}
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus();}
    if(e.key==='Escape'&&document.activeElement===$('q')){$('q').value='';onSearch();}
    if(e.key==='Escape'){hideSugs();}
  });
  document.addEventListener('click', e=>{if(!e.target.closest('.searchwrap'))hideSugs();});
}
function renderHot(){
  let h='<span>高频：</span>';
  HOT.forEach(k=>{h+='<button class="hk" data-k="'+k+'">'+k+'</button>';});
  if(RECENT.length){
    h+='<span style="margin-left:14px">最近：</span>';
    RECENT.forEach(q=>{h+='<button class="hk recent" data-q="'+esc(q)+'">🕘 '+esc(q)+'<span class="hx" data-del="'+esc(q)+'" title="删除这条记录">×</span></button>';});
  }
  $('hotRow').innerHTML=h;
  $('hotRow').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{$('q').value=b.dataset.k;commitSearch();$('q').focus();});
  $('hotRow').querySelectorAll('[data-del]').forEach(x=>x.onmousedown=e=>{e.preventDefault();e.stopPropagation();RECENT=RECENT.filter(r=>r!==x.dataset.del);try{localStorage.setItem('djr_recent',JSON.stringify(RECENT));}catch(err){}renderHot();});
  $('hotRow').querySelectorAll('[data-q]').forEach(b=>b.onclick=e=>{if(e.target.classList.contains('hx'))return;$('q').value=b.dataset.q;commitSearch();$('q').focus();});
}
/* ---- 搜索建议下拉 ---- */
let SUGS=[], sugIdx=-1;
function buildSugs(q){
  const out=[];
  const areas=[...new Set(DATA.rows.filter(r=>r.area.includes(q)||(q.length>=2&&q.includes(r.area.replace(/区（新城）|区/g,''))) ).map(r=>({area:r.area,region:r.region})))];
  areas.slice(0,4).forEach(a=>out.push({t:'片区',label:a.area,sub:a.region,act:()=>{$('q').value=a.area;commitSearch();}}));
  DATA.roles.filter(r=>r.includes(q)||(DATA.role_keywords[r]||[]).some(k=>q.includes(k)||k.includes(q))).slice(0,3)
    .forEach(r=>out.push({t:'角色',label:r,sub:(DATA.role_keywords[r]||[]).join('/'),act:()=>{const kw=(DATA.role_keywords[r]||[r])[0];const cur=$('q').value.trim();$('q').value=(cur&&!cur.includes(kw)?cur+' '+kw:kw);commitSearch();}}));
  Object.keys(PINDEX).filter(n=>n.length>=2&&n.includes(q)).slice(0,4)
    .forEach(n=>{const e=PINDEX[n];out.push({t:'人名',label:n,sub:e.roles.slice(0,2).join('、'),act:()=>{curPerson=n;curResult=null;hideSugs();render();}});});
  return out;
}
function renderSugs(){
  const q=$('q').value.trim();
  if(!q){hideSugs();return;}
  SUGS=buildSugs(q);sugIdx=-1;
  if(!SUGS.length){hideSugs();return;}
  let h='<div class="sugtip">点选下方建议，或按回车 ↵ 直接跳转到结果位置</div>';
  SUGS.forEach((s,i)=>{h+='<div class="sug" data-i="'+i+'"><span class="tg">'+s.t+'</span><span>'+esc(s.label)+'</span><span class="sub2">'+esc(s.sub||'')+'</span></div>';});
  $('sugs').innerHTML=h;$('sugs').style.display='block';
  $('sugs').querySelectorAll('.sug').forEach(el=>{
    el.onmousedown=e=>{e.preventDefault();SUGS[+el.dataset.i].act();};
  });
}
function hideSugs(){$('sugs').style.display='none';SUGS=[];sugIdx=-1;}
function onKey(e){
  const shown=$('sugs').style.display&&$('sugs').style.display!=='none';
  if(e.key==='Enter'){
    e.preventDefault();
    if(shown&&sugIdx>=0){SUGS[sugIdx].act();return;}
    hideSugs();commitSearch();return;
  }
  if(!shown)return;
  const items=$('sugs').querySelectorAll('.sug');
  if(e.key==='ArrowDown'){e.preventDefault();sugIdx=Math.min(sugIdx+1,SUGS.length-1);}
  else if(e.key==='ArrowUp'){e.preventDefault();sugIdx=Math.max(sugIdx-1,0);}
  else return;
  items.forEach((el,i)=>el.classList.toggle('on',i===sugIdx));
}
function renderRegionTabs(){
  let h='<button class="tab'+(curRegion?'':' on')+'" data-r="">全部大区</button>';
  DATA.region_order.forEach(r=>{h+='<button class="tab'+(curRegion===r?' on':'')+'" data-r="'+r+'">'+r+'</button>';});
  h+='<button class="tab reset" id="btnReset">↺ 重置</button>';
  $('regionTabs').innerHTML=h;
  $('regionTabs').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{curRegion=b.dataset.r||null;curAreaFilter=null;curPerson=null;curResult=null;renderRegionTabs();render();});
  $('btnReset').onclick=()=>{curRegion=null;curRole=null;curAreaFilter=null;curPerson=null;curResult=null;$('q').value='';$('clr').style.display='none';renderRegionTabs();renderRoleTabs();render();};
}
function renderRoleTabs(){
  let h='';
  DATA.roles.forEach(r=>{h+='<button class="tab'+(curRole===r?' on':'')+'" data-o="'+r+'">'+r+'</button>';});
  $('roleTabs').innerHTML=h;
  $('roleTabs').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{curRole=(curRole===b.dataset.o?null:b.dataset.o);curPerson=null;curResult=null;renderRoleTabs();render();});
}
function notesNow(){return DATA.notes.filter(n=>!curRegion||n.region===curRegion);}
function renderNotes(){
  const ns=notesNow();
  if(!ns.length){$('notes').style.display='none';return;}
  let h='<div class="nt">📌 临时备注 · 重要提醒（'+ns.length+' 条）</div>';
  ns.forEach(n=>{h+='<div class="ni"><span class="tag">'+n.region.replace('大区','')+'・'+n.area+'</span>'+n.text+'</div>';});
  $('notes').innerHTML=h;$('notes').style.display=(!curRole&&!curPerson&&!curResult)?'block':'none';
}
function rowsFiltered(){
  return DATA.rows.filter(r=>(!curRegion||r.region===curRegion)&&(!curAreaFilter||curAreaFilter.includes(r.area)));
}
// 搜索/点选出结果后自动滚到结果位置，不用再手动下拉
function scrollToResult(){
  const el=(curPerson||curResult)?$('pcard'):((curRole||curAreaFilter||curRegion)?$('cap'):null);
  if(el)setTimeout(()=>el.scrollIntoView({block:'start'}),60);
}
function render(){
  $('pcard').style.display='none';
  renderNotes();
  if(curPerson){renderPerson();$('cap').textContent='';$('tbl').innerHTML='';$('tbl').className='';$('tscroll').style.display='none';scrollToResult();return;}
  if(curResult){renderResult();scrollToResult();return;}
  $('tscroll').style.display='';
  const rows=rowsFiltered();
  if(curRole==='AI群内管家账号'){
    const regs=curRegion?[curRegion]:DATA.region_order;
    const pairs=regs.map(rg=>[rg,[...new Set(DATA.rows.filter(r=>r.region===rg).map(r=>r.roles[curRole]).filter(Boolean))]]).filter(p=>p[1].length);
    $('cap').textContent=curRole+' · '+pairs.length+' 个大区（每大区一个AI群管家账号）· 单击账号可复制';
    $('tbl').className='';
    let h='<thead><tr><th class="wa sl0 slE">大区</th><th>'+curRole+'</th></tr></thead><tbody>';
    notesNow().forEach(n=>{h+='<tr class="nrow"><td class="wa sl0 slE">📝 备注</td><td>'+esc(n.text)+'</td></tr>';});
    pairs.forEach(p=>{h+='<tr><td class="rg wa sl0 slE">'+esc(p[0])+'</td><td>'+clip(p[1].join('\n'))+'</td></tr>';});
    $('tbl').innerHTML=h+'</tbody>';
  }else if(curRole==='管家账号（非AI群）'){
    $('cap').textContent=curRole+' · '+(curRegion||'全部大区')+' · '+rows.length+' 个片区 · 单击账号可复制';
    $('tbl').className='';
    let h='<thead><tr><th class="w1 sl0">大区</th><th class="wa sl1 slE">地区</th><th>'+curRole+'</th></tr></thead><tbody>';
    notesNow().forEach(n=>{h+='<tr class="nrow"><td class="w1 sl0">📝 备注</td><td class="wa sl1 slE" colspan="2">'+esc(n.text)+'</td></tr>';});
    const marks=[];let lastRg=null;
    rows.forEach((r,i)=>{if(r.region!==lastRg){marks.push([i,1]);lastRg=r.region;}else{marks[marks.length-1][1]++;}});
    let mi=0;
    rows.forEach((r,i)=>{h+='<tr>';if(mi<marks.length&&marks[mi][0]===i){h+='<td class="rg w1 sl0" rowspan="'+marks[mi][1]+'">'+esc(r.region)+'</td>';mi++;}h+='<td class="wa sl1 slE"><b>'+fmtArea(r.area)+'</b></td><td>'+clip(r.roles[curRole])+'</td></tr>';});
    $('tbl').innerHTML=h+'</tbody>';
  }else if(curRole){
    $('cap').textContent=curRole+' · '+(curRegion||'全部大区')+' · '+rows.length+' 个片区 · 单击人名可复制';
    $('tbl').className='';
    let h='<thead><tr><th class="wa sl0 slE">地区</th><th class="wb">'+curRole+'</th><th>职位</th></tr></thead><tbody>';
    notesNow().forEach(n=>{h+='<tr class="nrow"><td class="wa sl0 slE">📝 备注</td><td colspan="2">'+esc(n.text)+'</td></tr>';});
    rows.forEach(r=>{const v=r.roles[curRole];const p=cleanName(v);h+='<tr><td class="wa sl0 slE"><b>'+fmtArea(r.area)+'</b></td><td>'+clip(v)+'</td><td>'+esc((p&&DATA.positions[p])||'')+'</td></tr>';});
    $('tbl').innerHTML=h+'</tbody>';
  }else{
    $('cap').textContent=(curRegion||'全部大区')+' · '+rows.length+' 个片区 × '+DATA.roles.length+' 类接口人（左右滑动查看；单击任意人名/账号即可复制）';
    $('tbl').className='';
    let h='<thead><tr><th class="w1 sl0">大区</th><th class="w2 sl1 slE">地区</th>'+DATA.roles.map(r=>'<th>'+r+'</th>').join('')+'</tr></thead><tbody>';
    let lastRg=null,span=0;const marks=[];
    rows.forEach((r,i)=>{if(r.region!==lastRg){marks.push([i,1]);lastRg=r.region;}else{marks[marks.length-1][1]++;}});
    let mi=0;
    rows.forEach((r,i)=>{
      h+='<tr>';
      if(mi<marks.length&&marks[mi][0]===i){h+='<td class="rg w1 sl0" rowspan="'+marks[mi][1]+'">'+esc(r.region)+'</td>';mi++;}
      h+='<td class="w2 sl1 slE"><b>'+fmtArea(r.area)+'</b></td>';
      DATA.roles.forEach(ro=>{const v=r.roles[ro];h+='<td>'+clip(v,NARROW[ro]?'clip4':'clip')+'</td>';});
      h+='</tr>';
    });
    $('tbl').innerHTML=h+'</tbody>';
  }
  scrollToResult();
}
function renderResult(){
  $('tscroll').style.display='none';
  const nA=new Set(curResult.map(x=>x.area)).size,nR=new Set(curResult.map(x=>x.role)).size;
  const regions=[...new Set(curResult.map(x=>x.region))];
  $('cap').textContent='查询结果 · '+nA+' 个片区 × '+nR+' 类角色 · '+regions.join('、')+' · 点「复制」直接粘贴到企微';
  let h='';
  curResult.forEach(x=>{const p=cleanName(x.value);const pos=p&&DATA.positions[p]||'';
    h+='<div class="rcard"><div class="rh">'+esc(x.area)+' · '+esc(x.roleShort)+' <span class="chip2">'+esc(x.region)+'</span></div><div class="rbox"><div class="rl">✅ '+esc(x.area)+' '+esc(x.role)+'</div><div class="rn">'+esc(x.value)+(pos?' <span class="rp">（'+esc(pos)+'）</span>':'')+'<button class="copybtn" data-cp="'+tit(x.value)+'">📋 复制</button></div></div></div>';});
  $('pcard').innerHTML=h;$('pcard').style.display='block';
  $('pcard').querySelectorAll('.copybtn').forEach(b=>b.onclick=()=>copyText(cleanName(b.dataset.cp)));
}
// 覆盖范围：大区前置分组，如「东北大区：吉林区、抚顺区；华南大区：广州区」
function fmtCover(areas){
  const groups={},order=[];
  areas.forEach(a=>{const i=a.lastIndexOf('(');const rg=a.slice(i+1,-1),ar=a.slice(0,i);if(!groups[rg]){groups[rg]=[];order.push(rg);}groups[rg].push(ar);});
  return order.map(rg=>rg+'：'+groups[rg].join('、')).join('；');
}
function renderPerson(){
  const p=curPerson;const e=PINDEX[p]||{roles:[],areas:[]};
  const regions=[...new Set(e.areas.map(a=>a.slice(a.lastIndexOf('(')+1,-1)))];
  let cover;
  if(regions.length===1){const rg=regions[0];const all=DATA.rows.filter(r=>r.region===rg).every(r=>e.areas.includes(r.area+'('+rg+')'));cover=all?'全'+rg:fmtCover(e.areas);}
  else cover=fmtCover(e.areas);
  const pos=DATA.positions[p]||'';
  let h='<div class="pn">'+esc(p)+(pos?' （'+esc(pos)+'）':'')+'： '+e.roles.map(esc).join('、 ')+'<button class="copybtn" id="cpP">📋 复制姓名</button></div><div class="row"><span class="lb">覆盖范围</span><span class="vl">'+esc(cover)+'</span></div>';
  // 该人名下的条目按角色聚合：一个角色一张卡，覆盖范围列出全部片区
  const pairs=[];
  DATA.rows.forEach(r=>{DATA.roles.forEach(ro=>{const v=r.roles[ro];if(!v)return;if(cleanName(v)===p||accountLines(v).includes(p))pairs.push({area:r.area,region:r.region,role:ro,value:v});});});
  const byRole={},roleOrder=[];
  pairs.forEach(x=>{if(!byRole[x.role]){byRole[x.role]={regions:[],areas:[]};roleOrder.push(x.role);}const g=byRole[x.role];if(!g.regions.includes(x.region))g.regions.push(x.region);g.areas.push(x.area+'('+x.region+')');});
  roleOrder.forEach(ro=>{
    const g=byRole[ro];
    let cover;
    if(g.regions.length===1){const rg=g.regions[0];const all=DATA.rows.filter(r=>r.region===rg).every(r=>g.areas.includes(r.area+'('+rg+')'));cover=all?'全'+rg:fmtCover(g.areas);}
    else cover=fmtCover(g.areas);
    h+='<div class="rcard"><div class="rh">'+esc(ro)+' <span class="chip2">'+esc(g.regions.join('、'))+'</span></div><div class="rbox"><div class="rl">✅ 覆盖范围：'+esc(cover)+'</div><div class="rn">'+esc(p)+(pos?' <span class="rp">（'+esc(pos)+'）</span>':'')+'<button class="copybtn" data-cp="'+tit(p)+'">📋 复制</button></div></div></div>';
  });
  $('pcard').innerHTML=h;
  $('pcard').style.display='block';
  $('cpP').onclick=()=>copyText(p);
  $('pcard').querySelectorAll('.copybtn[data-cp]').forEach(b=>b.onclick=()=>copyText(cleanName(b.dataset.cp)));
}
// 输入过程只更新建议下拉，不跳动页面；回车（commitSearch）才执行并跳转
function onSearch(){
  const q=$('q').value.trim();
  $('clr').style.display=q?'block':'none';
  if(!q){curPerson=null;curAreaFilter=null;curResult=null;hideSugs();window.scrollTo(0,0);renderRegionTabs();render();return;}
  renderSugs();
}
function commitSearch(){
  const q=$('q').value.trim();
  $('clr').style.display=q?'block':'none';
  curPerson=null;curAreaFilter=null;curResult=null;
  if(!q){hideSugs();window.scrollTo(0,0);renderRegionTabs();render();return;}
  hideSugs();
  // 1) 人名 / 管家账号匹配
  const names=Object.keys(PINDEX);
  let hit=names.find(n=>n.length>=2&&q.includes(n));
  if(!hit)hit=names.find(n=>n.length>=2&&n.includes(q));
  if(hit){curPerson=hit;curResult=null;saveRecent(q);render();return;}
  // 2) 片区匹配
  const areaHits=DATA.rows.filter(r=>q.includes(r.area.replace(/区（新城）|区/g,''))||q.includes(r.area)).map(r=>r.area);
  if(areaHits.length)curAreaFilter=[...new Set(areaHits)];
  // 3) 大区匹配
  const rg=DATA.region_order.find(r=>q.includes(r.replace('大区','')));
  if(rg)curRegion=rg; else if(areaHits.length)curRegion=null;
  // 4) 角色匹配
  const ro=DATA.roles.find(r=>q.includes(r)||(SPEC[r]||[]).some(k=>q.includes(k)))||DATA.roles.find(r=>(DATA.role_keywords[r]||[]).some(k=>q.includes(k)))||null;
  // 5) 地区+角色 → 查询结果卡片
  if(areaHits.length&&ro){
    curResult=areaHits.flatMap(a=>DATA.rows.filter(r=>r.area===a).map(r=>({area:a,region:r.region,role:ro,roleShort:ro.replace(/接口人$/,''),value:r.roles[ro]}))).filter(x=>x.value);
    const rgs=[...new Set(curResult.map(x=>x.region))];
    if(rgs.length===1)curRegion=rgs[0];
    curRole=null;
    saveRecent(q);
    renderRegionTabs();renderRoleTabs();render();return;
  }
  curResult=null;
  curRole=ro;
  if(ro||areaHits.length)saveRecent(q);
  renderRegionTabs();renderRoleTabs();render();
}
boot();
</script>
