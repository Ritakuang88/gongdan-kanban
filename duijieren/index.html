function accountLines(v){return v? v.split(/\n+/).map(s=>s.trim()).filter(Boolean):[];}
let PINDEX={};
function addP(n,ro,r){if(!n)return;const e=PINDEX[n]||(PINDEX[n]={roles:[],areas:[]});if(!e.roles.includes(ro))e.roles.push(ro);const a=r.area+'('+r.region+')';if(!e.areas.includes(a))e.areas.push(a);}
function buildIndex(){PINDEX={};DATA.rows.forEach(r=>{DATA.roles.forEach(ro=>{const v=r.roles[ro];if(!v)return;addP(cleanName(v),ro,r);accountLines(v).forEach(l=>addP(l,ro,r));});});}
function init(){
  $('sub').textContent = DATA.meta.n_regions+' 大区 '+DATA.meta.n_areas+' 片区 · '+DATA.meta.n_roles+' 类接口人 · 数据 '+DATA.meta.synced_at+' 同步';
  buildIndex();
  renderRegionTabs(); renderRoleTabs(); renderNotes(); render();
  $('q').addEventListener('input', onSearch);
  $('clr').addEventListener('click', ()=>{$('q').value='';onSearch();});
}
function renderRegionTabs(){
  let h='<button class="tab'+(curRegion?'':' on')+'" data-r="">全部大区</button>';
  DATA.region_order.forEach(r=>{h+='<button class="tab'+(curRegion===r?' on':'')+'" data-r="'+r+'">'+r+'</button>';});
  h+='<button class="tab reset" id="btnReset">↺ 重置</button>';
  h+='<button class="tab refresh" id="btnRefresh">🔄 刷新数据</button>';
  $('regionTabs').innerHTML=h;
  $('regionTabs').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{curRegion=b.dataset.r||null;curAreaFilter=null;curPerson=null;renderRegionTabs();render();});
  $('btnReset').onclick=()=>{curRegion=null;curRole=null;curAreaFilter=null;curPerson=null;$('q').value='';$('clr').style.display='none';renderRegionTabs();renderRoleTabs();render();};
  $('btnRefresh').onclick=()=>toast('本页为静态快照（同步于 '+DATA.meta.synced_at+'）。名单更新后，请维护者在千问办公说「更新对接人」重新生成发布。');
}
function renderRoleTabs(){
  let h='';
  DATA.roles.forEach(r=>{h+='<button class="tab'+(curRole===r?' on':'')+'" data-o="'+r+'">'+r+'</button>';});
  $('roleTabs').innerHTML=h;
  $('roleTabs').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{curRole=(curRole===b.dataset.o?null:b.dataset.o);curPerson=null;renderRoleTabs();render();});
}
function renderNotes(){
  if(!DATA.notes.length){$('notes').style.display='none';return;}
  let h='<div class="nt">📌 临时备注 · 重要提醒（'+DATA.notes.length+' 条）</div>';
  DATA.notes.forEach(n=>{h+='<div class="ni"><span class="tag">'+n.region.replace('大区','')+'・'+n.area+'</span>'+n.text+'</div>';});
  $('notes').innerHTML=h;$('notes').style.display='block';
}
function rowsFiltered(){
  return DATA.rows.filter(r=>(!curRegion||r.region===curRegion)&&(!curAreaFilter||curAreaFilter.includes(r.area)));
}
function render(){
  $('pcard').style.display='none';
  if(curPerson){renderPerson();$('cap').textContent='';$('tbl').innerHTML='';return;}
  const rows=rowsFiltered();
  if(curRole){
    $('cap').textContent=curRole+' · '+(curRegion||'全部大区')+' · '+rows.length+' 个片区（表头已冻结，上下滑动对照）';
    let h='<thead><tr><th>地区</th><th>'+curRole+'</th><th>职位</th></tr></thead><tbody>';
    rows.forEach(r=>{const v=r.roles[curRole];const p=cleanName(v);h+='<tr><td><b>'+esc(r.area)+'</b></td><td>'+(fmt(v)||'<span class="none">—</span>')+'</td><td>'+esc((p&&DATA.positions[p])||'')+'</td></tr>';});
    $('tbl').innerHTML=h+'</tbody>';
  }else{
    $('cap').textContent=(curRegion||'全部大区')+' · '+rows.length+' 个片区 × '+DATA.roles.length+' 类接口人（左右滑动查看，点击上方大区标签可单看一个大区）';
    let h='<thead><tr><th>大区</th><th>地区</th>'+DATA.roles.map(r=>'<th>'+r+'</th>').join('')+'</tr></thead><tbody>';
    let lastRg=null,span=0;const marks=[];
    rows.forEach((r,i)=>{if(r.region!==lastRg){marks.push([i,1]);lastRg=r.region;}else{marks[marks.length-1][1]++;}});
    let mi=0;
    rows.forEach((r,i)=>{
      h+='<tr>';
      if(mi<marks.length&&marks[mi][0]===i){h+='<td class="rg" rowspan="'+marks[mi][1]+'">'+r.region+'</td>';mi++;}
      h+='<td><b>'+esc(r.area)+'</b></td>';
      DATA.roles.forEach(ro=>{const v=r.roles[ro];h+='<td>'+(fmt(v)||'<span class="none">—</span>')+'</td>';});
      h+='</tr>';
    });
    $('tbl').innerHTML=h+'</tbody>';
  }
}
function renderPerson(){
  const p=curPerson;const e=PINDEX[p]||{roles:[],areas:[]};
  const regions=[...new Set(e.areas.map(a=>a.slice(a.indexOf('(')+1,-1)))];
  let cover;
  if(regions.length===1){const rg=regions[0];const all=DATA.rows.filter(r=>r.region===rg).every(r=>e.areas.includes(r.area+'('+rg+')'));cover=all?'全'+rg:e.areas.join('、');}
  else cover=e.areas.join('、');
  const pos=DATA.positions[p]||'';
  $('pcard').innerHTML='<div class="pn">'+esc(p)+(pos?' （'+esc(pos)+'）':'')+'： '+e.roles.map(esc).join('、 ')+'</div><div class="row"><span class="lb">覆盖范围</span><span class="vl">'+esc(cover)+'</span></div>';
  $('pcard').style.display='block';
}
function onSearch(){
  const q=$('q').value.trim();
  $('clr').style.display=q?'block':'none';
  curPerson=null;curAreaFilter=null;
  if(!q){renderRegionTabs();render();return;}
  // 1) 人名 / 管家账号匹配
  const names=Object.keys(PINDEX);
  let hit=names.find(n=>n.length>=2&&q.includes(n));
  if(!hit)hit=names.find(n=>n.length>=2&&n.includes(q));
  if(hit){curPerson=hit;render();return;}
  // 2) 片区匹配
  const areaHits=DATA.rows.filter(r=>q.includes(r.area.replace('区',''))||q.includes(r.area)).map(r=>r.area);
  if(areaHits.length)curAreaFilter=[...new Set(areaHits)];
  // 3) 大区匹配
  const rg=DATA.region_order.find(r=>q.includes(r.replace('大区','')));
  if(rg)curRegion=rg;
  // 4) 角色匹配
  const ro=DATA.roles.find(r=>{const kws=DATA.role_keywords[r]||[];return q.includes(r)||kws.some(k=>q.includes(k));});
  if(ro)curRole=ro;
  renderRegionTabs();renderRoleTabs();render();
}
init();
</script>
</body>
</html>
